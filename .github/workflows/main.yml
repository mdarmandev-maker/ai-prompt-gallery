name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Code Download karna
        uses: actions/checkout@v4

      - name: Python Setup karna
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tools aur Buildozer Install karna
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev cmake zip unzip openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: APK Banana (Buildozer Run)
        run: |
          yes | buildozer -v android debug

      - name: APK Save karna
        uses: actions/upload-artifact@v4
        with:
          name: AI-Prompt-Gallery-APK
          path: bin/*.apk
