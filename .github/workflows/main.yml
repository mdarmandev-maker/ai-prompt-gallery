name: BuilAndroidAPK
on:
  push:
    branches:
      - main
jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Code Download karna
        uses: actions/checkout@v4

      - name: 2. Python Setup karna
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 2b. Runner ki Extra Disk Space Free karna
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          echo "After cleanup:"
          df -h /

      - name: 3. Zaroori Linux Tools Install karna
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libtool pkg-config autoconf automake zip unzip openjdk-17-jdk libffi-dev libssl-dev cmake curl
          pip install --upgrade pip
          pip install buildozer virtualenv "Cython<3.0"

      - name: 4. Buildozer Android Build
        run: |
          # FIX: Runner ka default JAVA_HOME Java 11 par point karta hai,
          # lekin Android Gradle Plugin ko Java 17 chahiye. GitHub runner
          # mein Java 17 pehle se installed hai (JAVA_HOME_17_X64 var
          # mein) - usi ko explicitly use karte hain.
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version

          yes | buildozer -v android debug

      # NAYA STEP: chahe build 4 pass ho ya fail, ye step hamesha
      # chalega (if: always()) aur batayega ki fail hone ke waqt disk
      # space kitna bacha tha - isse hume 100% pata chal jayega ki
      # ye disk-space issue hai ya kuch aur.
      - name: 4b. Disk Space Check karna (Debug ke liye)
        if: always()
        run: |
          echo "===== DISK SPACE (root) ====="
          df -h /
          echo "===== .buildozer FOLDER SIZE ====="
          du -sh /home/runner/work/*/*/.buildozer 2>/dev/null || echo "not found"
          echo "===== LAST 200 LINES OF BUILD LOG (agar bacha ho) ====="
          find /home/runner -iname "*.log" -newer /home/runner/work -exec tail -n 200 {} \; 2>/dev/null || true

      - name: 5. APK ko Save karna
        uses: actions/upload-artifact@v4
        with:
          name: AI-Prompt-Gallery-APK
          path: bin/*.apk
