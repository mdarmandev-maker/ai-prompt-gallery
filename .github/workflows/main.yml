name: BuilAndroidAPK
on:
  push:
    branches:
      - main
jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Code Download karna
        uses: actions/checkout@v4
      - name: 2. Python Setup karna
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 3. Zaroori Linux Tools Install karna
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libtool pkg-config autoconf automake zip unzip openjdk-17-jdk libffi-dev libssl-dev cmake curl
          pip install --upgrade pip
          pip install buildozer virtualenv "Cython<3.0"
      - name: 4. Buildozer Android Build
        run: |
          # NOTE: 'yes |' WAPAS ADD KIYA - ye zaroori hai taaki jab
          # buildozer pehli baar Android SDK Build-Tools / licenses
          # download kare, to har "Accept? (y/N)" prompt ko automatic
          # "y" mil jaye. Isko hata dene se hi pichhli baar
          # "Aidl not found" wala error aaya tha.
          yes | buildozer -v android debug
      - name: 5. APK ko Save karna
        uses: actions/upload-artifact@v4
        with:
          name: AI-Prompt-Gallery-APK
          path: bin/*.apk
